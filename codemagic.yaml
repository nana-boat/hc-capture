workflows:
  ios-unsigned:
    name: HC Capture - unsigned IPA (install with Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build (no signing)
        script: |
          xcodebuild -project HCCapture.xcodeproj -target HCCapture \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        script: |
          rm -rf Payload && mkdir Payload
          cp -R build/Release-iphoneos/HCCapture.app Payload/
          zip -qry HCCapture-unsigned.ipa Payload
    artifacts:
      - HCCapture-unsigned.ipa
