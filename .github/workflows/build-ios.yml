name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    paths: ["App/**", "Config/**", "project.yml", ".github/workflows/**"]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (no signing)
        run: |
          xcodebuild -project HCCapture.xcodeproj -target HCCapture \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Release-iphoneos/HCCapture.app Payload/
          zip -qry HCCapture-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HCCapture-unsigned-ipa
          path: HCCapture-unsigned.ipa
