name: HCCapture
options:
  bundleIdPrefix: org.hyperchat
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  HCCapture:
    type: application
    platform: iOS
    sources:
      - path: App
    scheme: {}
    preBuildScripts:
      - name: Report Swift errors
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT"
          xcrun swiftc -typecheck -sdk "$SDKROOT" -target arm64-apple-ios16.0 App/*.swift > "$TMPDIR/hc_tc.log" 2>&1 || true
          grep -E "error:" "$TMPDIR/hc_tc.log" | sed -E 's#^.*/(App/)#\1#' | sort -u | head -9 | while IFS= read -r l; do echo "::error::$l"; done
          exit 0
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_NAME: HCCapture
        PRODUCT_BUNDLE_IDENTIFIER: org.hyperchat.hccapture
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
